<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かんじドリル</title>
<style>
  :root{
    --paper: #EEF3F5;
    --paper-line: #C9D6DC;
    --ink: #1D2B3A;
    --ink-soft: #55677A;
    --accent: #6B8CFF;
    --accent-deep: #4A67D6;
    --ok: #2A9D8F;
    --ok-deep: #1F7A70;
    --ng: #E15554;
    --ng-deep: #B93E3D;
    --card: #FFFFFF;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body{ height: 100%; margin:0; }
  body{
    font-family: 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Rounded Mplus 1c', sans-serif;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 40px,
      var(--paper);
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 16px;
    overflow:hidden;
  }
  .stage{ width:100%; max-width: 1100px; height: 100%; max-height: 720px; display:flex; flex-direction:column; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 4px 14px;
    border-bottom: 3px dashed var(--paper-line);
    margin-bottom: 14px;
  }
  h1{ font-size: 22px; margin:0; letter-spacing: .04em; }
  .header-right{ display:flex; align-items:center; gap:16px; }
  .stats{ display:flex; gap: 18px; font-size: 15px; color: var(--ink-soft); }
  .stats b{ color: var(--ink); font-size: 17px; }
  .stats .ok-count{ color: var(--ok-deep); }
  .stats .ng-count{ color: var(--ng-deep); }
  .player-badge{ font-size: 14px; color: var(--ink-soft); }
  .player-badge b{ color: var(--ink); }
  .change-player-btn{
    padding: 6px 14px; border-radius: 10px; border: 2px solid var(--paper-line);
    background:#fff; font-size: 12px; color: var(--ink-soft); cursor:pointer; margin-left:6px;
  }
  .quit-btn{
    padding: 8px 18px; border-radius: 12px; border: 2px solid var(--paper-line);
    background: #fff; font-size: 14px; font-weight:700; color: var(--ink-soft); cursor:pointer;
  }
  .quit-btn:active, .change-player-btn:active{ transform: scale(.96); }

  .screen{ flex:1; display:none; min-height:0; }
  .screen.active{ display:flex; flex-direction:column; }

  /* player select */
  #playerSelect{ align-items:center; justify-content:center; text-align:center; gap: 26px; }
  #playerSelect p{ color: var(--ink-soft); font-size: 16px; margin:0; }
  .player-list{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width: 640px; }
  .player-card{
    padding: 18px 26px; border-radius: 18px; border: 3px solid var(--paper-line);
    background: var(--card); font-size: 19px; font-weight:800; cursor:pointer; min-width: 120px;
  }
  .player-card:active{ transform: scale(.96); }

  /* setup */
  #setup{ align-items:center; justify-content:center; text-align:center; gap: 24px; overflow-y:auto; padding: 8px; }
  #setup p{ color: var(--ink-soft); font-size: 16px; margin:0; }
  .choice-row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width: 720px; }
  .choice{
    padding: 14px 22px; border-radius: 16px; border: 3px solid var(--paper-line);
    background: var(--card); font-size: 17px; font-weight:700; cursor:pointer;
  }
  .choice.selected{ border-color: var(--accent-deep); background: #EAEEFF; }
  .choice:active{ transform: scale(.96); }
  .start-btn{
    margin-top: 6px; padding: 18px 54px; border-radius: 20px; border:none;
    background: var(--accent); color: #fff; font-size: 22px; font-weight:800;
    box-shadow: 0 4px 0 var(--accent-deep); cursor:pointer;
  }
  .start-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }

  /* play */
  #play{ align-items:center; justify-content:center; gap: 24px; }
  .kanji-card{
    background: var(--card); border-radius: 28px; padding: 30px 70px;
    box-shadow: 0 3px 0 var(--paper-line);
    font-size: 130px; font-weight: 800; letter-spacing: .02em; line-height:1;
  }
  .answer-area{ width:100%; max-width: 480px; display:flex; flex-direction:column; align-items:center; gap: 16px; }

  .kana-input-row{ display:flex; gap:10px; width:100%; }
  .kana-input{
    flex:1; font-family: inherit; font-size: 30px; text-align:center;
    padding: 16px 12px; border-radius: 16px; border: 3px solid var(--paper-line);
    background:#fff; color: var(--ink);
  }
  .kana-input:focus{ outline:none; border-color: var(--accent-deep); }
  .decide-btn{
    padding: 0 30px; border-radius: 16px; border:none; background: var(--accent);
    color:#fff; font-size:18px; font-weight:800; cursor:pointer;
    box-shadow: 0 3px 0 var(--accent-deep);
  }
  .decide-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }

  .choice4-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; width:100%; }
  .choice4-btn{
    padding: 20px 10px; border-radius: 18px; border: 3px solid var(--paper-line);
    background: var(--card); font-size: 26px; font-weight:800; cursor:pointer; color: var(--ink);
  }
  .choice4-btn:active{ transform: scale(.96); }

  /* feedback overlay */
  .feedback{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background: rgba(29,43,58,.42); z-index: 10;
  }
  .feedback.active{ display:flex; }
  .feedback-card{
    background:#fff; border-radius: 26px; padding: 36px 48px; text-align:center;
    min-width: 280px;
  }
  .feedback-card.ok{ box-shadow: 0 0 0 6px var(--ok) inset; }
  .feedback-card.ng{ box-shadow: 0 0 0 6px var(--ng) inset; }
  .fb-title{ font-size: 30px; font-weight: 900; margin-bottom: 6px; }
  .fb-title.ok{ color: var(--ok-deep); }
  .fb-title.ng{ color: var(--ng-deep); }
  .fb-sub{ font-size: 17px; color: var(--ink-soft); margin-bottom: 18px; }
  .fb-next{
    padding: 12px 40px; border-radius: 14px; border:none; background: var(--ink);
    color:#fff; font-size:17px; font-weight:700; cursor:pointer;
  }
  .confirm-row{ display:flex; gap: 14px; justify-content:center; }
  .confirm-btn{
    padding: 12px 30px; border-radius: 14px; font-size:17px; font-weight:700; cursor:pointer;
  }
  .confirm-btn.no{ border: 2px solid var(--paper-line); background:#fff; color: var(--ink-soft); }
  .confirm-btn.yes{ border:none; background: var(--ng); color:#fff; }
  .confirm-btn:active{ transform: scale(.96); }

  /* result */
  #result{ align-items:center; justify-content:center; text-align:center; gap: 18px; }
  .result-score{ font-size: 56px; font-weight:900; }
  .result-score .frac{ color: var(--ink-soft); font-size: 28px; }
  .result-msg{ font-size: 18px; color: var(--ink-soft); }
  .result-actions{ display:flex; gap: 12px; }
  .retry-btn{
    padding: 16px 44px; border-radius: 18px; border:none;
    background: var(--ink); color:#fff; font-size:19px; font-weight:800; cursor:pointer;
  }
  .ghost-btn{
    padding: 16px 32px; border-radius: 18px; border: 2px solid var(--paper-line);
    background: #fff; color: var(--ink-soft); font-size:17px; font-weight:700; cursor:pointer;
  }

  /* history */
  #history{ align-items:center; justify-content:center; text-align:center; gap: 18px; }
  .history-summary{ display:flex; gap: 24px; }
  .history-summary div{ font-size: 15px; color: var(--ink-soft); }
  .history-summary b{ font-size: 22px; color: var(--ink); display:block; }
  .history-list{
    width: 100%; max-width: 460px; max-height: 260px; overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
  }
  .history-row{
    display:flex; justify-content:space-between; background: var(--card); border-radius: 12px;
    padding: 10px 16px; font-size: 15px; box-shadow: 0 2px 0 var(--paper-line);
  }
  .history-row .rate{ color: var(--ok-deep); font-weight:800; }
</style>
</head>
<body>
<div class="stage">

  <header>
    <h1>かんじドリル</h1>
    <div class="header-right">
      <div class="player-badge" id="playerBadge" style="display:none">
        プレイヤー：<b id="playerBadgeName"></b>
        <button class="change-player-btn" id="changePlayerBtn">かえる</button>
      </div>
      <div class="stats">
        <div>もんだい <b id="statIndex">1</b> / <b id="statTotal">10</b></div>
        <div class="ok-count">せいかい <b id="statOk">0</b></div>
        <div class="ng-count">まちがい <b id="statNg">0</b></div>
      </div>
      <button class="quit-btn" id="quitBtn" style="display:none">やめる</button>
    </div>
  </header>

  <!-- player select screen -->
  <div id="playerSelect" class="screen active">
    <div>
      <p>だれが やる？</p>
      <div class="player-list" id="playerList"></div>
    </div>
  </div>

  <!-- setup screen -->
  <div id="setup" class="screen">
    <div>
      <p>がくねんを えらんでね</p>
      <div class="choice-row" id="gradeChoices">
        <div class="choice selected" data-grade="1">1ねんせい</div>
        <div class="choice" data-grade="2">2ねんせい</div>
        <div class="choice" data-grade="3">3ねんせい</div>
        <div class="choice" data-grade="4">4ねんせい</div>
        <div class="choice" data-grade="5">5ねんせい</div>
        <div class="choice" data-grade="6">6ねんせい</div>
        <div class="choice" data-grade="all">ぜんぶ まぜまぜ</div>
      </div>
    </div>
    <div>
      <p>もんだいの すう</p>
      <div class="choice-row" id="countChoices">
        <div class="choice selected" data-count="10">10もん</div>
        <div class="choice" data-count="20">20もん</div>
        <div class="choice" data-count="30">30もん</div>
      </div>
    </div>
    <div>
      <p>こたえかた</p>
      <div class="choice-row" id="modeChoices">
        <div class="choice selected" data-mode="input">よみを ひらがなで にゅうりょく</div>
        <div class="choice" data-mode="quiz">4つから えらぶ</div>
        <div class="choice" data-mode="mix">まぜまぜ</div>
      </div>
    </div>
    <button class="start-btn" id="startBtn">はじめる</button>
  </div>

  <!-- play screen -->
  <div id="play" class="screen">
    <div class="kanji-card" id="kanjiText">?</div>
    <div class="answer-area">
      <div class="kana-input-row" id="inputArea">
        <input type="text" class="kana-input" id="answerInput" placeholder="よみかた" autocomplete="off" autocorrect="off" autocapitalize="none">
        <button class="decide-btn" id="decideBtn">けってい</button>
      </div>
      <div class="choice4-grid" id="choiceArea" style="display:none"></div>
    </div>
  </div>

  <!-- result screen -->
  <div id="result" class="screen">
    <div class="result-score"><span id="resultOk">0</span><span class="frac"> / <span id="resultTotal">10</span> もん せいかい</span></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-actions">
      <button class="retry-btn" id="retryBtn">もういちど</button>
      <button class="ghost-btn" id="showHistoryBtn">きろくを見る</button>
    </div>
  </div>

  <!-- history screen -->
  <div id="history" class="screen">
    <p id="historyPlayerName"></p>
    <div class="history-summary">
      <div><b id="histTotalSessions">0</b>かいすう</div>
      <div><b id="histTotalOk">0</b>せいかい（るいけい）</div>
      <div><b id="histTotalRate">0%</b>せいかいりつ</div>
    </div>
    <div class="history-list" id="historyList"></div>
    <button class="ghost-btn" id="historyBackBtn">もどる</button>
  </div>

</div>

<div class="feedback" id="feedback">
  <div class="feedback-card" id="feedbackCard">
    <div class="fb-title" id="fbTitle"></div>
    <div class="fb-sub" id="fbSub"></div>
    <button class="fb-next" id="fbNext">つぎへ</button>
  </div>
</div>

<div class="feedback" id="quitConfirm">
  <div class="feedback-card">
    <div class="fb-title">トップに もどる？</div>
    <div class="fb-sub">いままでの もんだいは きえちゃうよ</div>
    <div class="confirm-row">
      <button class="confirm-btn no" id="quitNo">つづける</button>
      <button class="confirm-btn yes" id="quitYes">もどる</button>
    </div>
  </div>
</div>

    player: null,

  };

  var FIXED_PLAYERS = ['つむぎ', 'しの', 'さく'];
  var STORAGE_KEY = 'kanjidrill_players_v1';

  function loadPlayers(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch(e){ return {}; }
  }
  function savePlayers(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  }
  function ensurePlayer(data, name){
    if(!data[name]){
      data[name] = { totalSessions: 0, totalOk: 0, totalQ: 0, history: [] };
    }
    return data[name];
  }

  function renderPlayerList(){
    var data = loadPlayers();
    var list = document.getElementById('playerList');
    list.innerHTML = '';
    FIXED_PLAYERS.forEach(function(name){
      ensurePlayer(data, name);
      var card = document.createElement('div');
      card.className = 'player-card';
      card.textContent = name;
      card.addEventListener('click', function(){ selectPlayer(name); });
      list.appendChild(card);
    });
    savePlayers(data);
  }

  function selectPlayer(name){
    state.player = name;
    var data = loadPlayers();
    ensurePlayer(data, name);
    savePlayers(data);
    document.getElementById('playerBadgeName').textContent = name;
    document.getElementById('playerBadge').style.display = '';
    showScreen('setup');
  }

  document.getElementById('changePlayerBtn').addEventListener('click', function(){
    renderPlayerList();
    showScreen('playerSelect');
  });

  // ---------- setup interactions ----------
  document.getElementById('gradeChoices').addEventListener('click', function(e){
    var el = e.target.closest('.choice');
    if(!el) return;
    document.querySelectorAll('#gradeChoices .choice').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
    state.grade = el.dataset.grade;
  });
  document.getElementById('countChoices').addEventListener('click', function(e){
    var el = e.target.closest('.choice');
    if(!el) return;
    document.querySelectorAll('#countChoices .choice').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
    state.total = parseInt(el.dataset.count, 10);

  // ---------- kana helpers ----------
  function kataToHira(s){
    return s.replace(/[\u30a1-\u30f6]/g, function(c){
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    });
  }
  function normalizeKana(s){
    return kataToHira((s||'').trim());
  }

  // ---------- problem pool ----------
  function poolForGrade(grade){
    if(grade === 'all') return KANJI_DATA;
    var g = parseInt(grade, 10);
    return KANJI_DATA.filter(function(d){ return d.g === g; });
  }

  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function pickDistractors(pool, correctReadings, count){
    var out = [];
    var tries = 0;
    while(out.length < count && tries < 200){
      tries++;
      var cand = pool[randInt(0, pool.length-1)];
      var r = cand.r[randInt(0, cand.r.length-1)];
      if(correctReadings.indexOf(r) === -1 && out.indexOf(r) === -1){
        out.push(r);
      }
    }
    return out;
  }

  function buildProblems(){
    var pool = poolForGrade(state.grade);
    var list = [];
    for(var i=0; i<state.total; i++){
      var item = pool[randInt(0, pool.length-1)];
      var correct = item.r[randInt(0, item.r.length-1)];
      var qMode = state.mode;

      var problem = { kanji: item.k, answer: correct, readings: item.r, mode: qMode };

          var tmp = options[j]; options[j] = options[k]; options[k] = tmp;
        }
        problem.options = options;
      }
      list.push(problem);
    }
    return list;
  }

    document.getElementById('kanjiText').textContent = p.kanji;
    document.getElementById('statIndex').textContent = state.index + 1;
    document.getElementById('statOk').textContent = state.ok;
    document.getElementById('statNg').textContent = state.ng;

    var inputArea = document.getElementById('inputArea');
    var choiceArea = document.getElementById('choiceArea');
    if(p.mode === 'input'){
      inputArea.style.display = '';
      choiceArea.style.display = 'none';
      var input = document.getElementById('answerInput');
      input.value = '';
      setTimeout(function(){ input.focus(); }, 50);
    } else {
      inputArea.style.display = 'none';
      choiceArea.style.display = '';
      choiceArea.innerHTML = '';
      p.options.forEach(function(opt){
        var btn = document.createElement('button');
        btn.className = 'choice4-btn';
        btn.textContent = opt;
        btn.addEventListener('click', function(){ submitAnswer(opt); });
        choiceArea.appendChild(btn);
      });
    }
  }

  document.getElementById('decideBtn').addEventListener('click', function(){
    var val = document.getElementById('answerInput').value;
    submitAnswer(val);
  });
  document.getElementById('answerInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ document.getElementById('decideBtn').click(); }
  });

  function submitAnswer(given){
    var p = state.problems[state.index];
    var normGiven = normalizeKana(given);
    var correct = p.readings.indexOf(normGiven) !== -1;
    if(correct) state.ok++; else state.ng++;
    showFeedback(correct, p);
  }

  function showFeedback(correct, p){
    var card = document.getElementById('feedbackCard');
    card.className = 'feedback-card ' + (correct ? 'ok' : 'ng');
    document.getElementById('fbTitle').className = 'fb-title ' + (correct ? 'ok' : 'ng');
    document.getElementById('fbTitle').textContent = correct ? 'せいかい！' : 'ざんねん';
    document.getElementById('fbSub').textContent = correct ? '' : 'こたえは 「' + p.answer + '」 だよ';
    document.getElementById('feedback').classList.add('active');
  }

  document.getElementById('fbNext').addEventListener('click', function(){
    document.getElementById('feedback').classList.remove('active');
    state.index++;
    if(state.index >= state.total){
      finishGame();
    } else {
      loadProblem();
    }
  });

  function finishGame(){
    document.getElementById('resultOk').textContent = state.ok;
    document.getElementById('resultTotal').textContent = state.total;
    var rate = state.ok / state.total;
    var msg = rate === 1 ? 'ぜんもん せいかい！すごい！' :
              rate >= 0.8 ? 'よくできました！' :
              rate >= 0.5 ? 'もうすこし れんしゅうしよう' :
              'あわてなくて だいじょうぶ、また ちょうせん！';
    document.getElementById('resultMsg').textContent = msg;
    if(state.player){
      var data = loadPlayers();
      var rec = ensurePlayer(data, state.player);
      rec.totalSessions += 1;
      rec.totalOk += state.ok;
      rec.totalQ += state.total;
      rec.history.push({
        date: new Date().toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'}),
        ok: state.ok,
        total: state.total
      });
      if(rec.history.length > 50) rec.history = rec.history.slice(-50);
      savePlayers(data);
    }
    showScreen('result');
  }

  function renderHistory(){
    var data = loadPlayers();
    var rec = ensurePlayer(data, state.player);
    document.getElementById('historyPlayerName').textContent = state.player + ' の きろく';
    document.getElementById('histTotalSessions').textContent = rec.totalSessions;
    document.getElementById('histTotalOk').textContent = rec.totalOk;
    var rate = rec.totalQ > 0 ? Math.round(rec.totalOk / rec.totalQ * 100) : 0;
    document.getElementById('histTotalRate').textContent = rate + '%';
    var list = document.getElementById('historyList');
    list.innerHTML = '';
    var recent = rec.history.slice(-15).reverse();
    recent.forEach(function(s){
      var row = document.createElement('div');
      row.className = 'history-row';
      var r = Math.round(s.ok / s.total * 100);
      row.innerHTML = '<span>' + s.date + '</span><span>' + s.ok + ' / ' + s.total + 'もん</span><span class="rate">' + r + '%</span>';
      list.appendChild(row);
    });
  }

  // ---------- init ----------
  renderPlayerList();

})();
</script>
</body>
</html>
